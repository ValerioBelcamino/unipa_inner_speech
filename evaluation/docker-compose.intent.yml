name: janus-intent-benchmark

services:
  intent-neo4j:
    image: neo4j:5.13.0-community
    ports:
      - "18474:7474"
      - "18687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
