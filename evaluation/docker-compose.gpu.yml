name: janus-vllm

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly}
    ipc: host
    shm_size: 16gb
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    command:
      - --model
      - ${LOCAL_MODEL:-Qwen/Qwen3.5-4B}
      - --served-model-name
      - ${LOCAL_MODEL:-Qwen/Qwen3.5-4B}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --dtype
      - ${VLLM_DTYPE:-auto}
      - --language-model-only
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
