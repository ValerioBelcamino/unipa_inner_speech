services:
  ollama:
    image: ollama/ollama:0.11.10
    container_name: janus-review-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - janus-review-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  janus-review-models:
    name: janus-review-models
